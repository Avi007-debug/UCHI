<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCHI Backend Connection Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .test-result {
            margin: 15px 0;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .pending {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="test-card">
        <h1>🧪 UCHI Backend Connection Test</h1>
        <p>This page tests the connection between frontend and Flask backend.</p>
        
        <button onclick="runTests()">Run Connection Tests</button>
        
        <div id="results"></div>
    </div>

    <script>
        const BACKEND_URL = 'http://localhost:5000';
        
        async function testEndpoint(name, url) {
            const resultDiv = document.createElement('div');
            resultDiv.className = 'test-result pending';
            resultDiv.innerHTML = `<strong>${name}</strong><br>Testing ${url}...`;
            document.getElementById('results').appendChild(resultDiv);
            
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                
                resultDiv.className = 'test-result success';
                resultDiv.innerHTML = `
                    <strong>✅ ${name}</strong><br>
                    <small>${url}</small><br>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.className = 'test-result error';
                resultDiv.innerHTML = `
                    <strong>❌ ${name}</strong><br>
                    <small>${url}</small><br>
                    Error: ${error.message}
                `;
            }
        }
        
        async function runTests() {
            document.getElementById('results').innerHTML = '';
            
            await testEndpoint('Health Check', `${BACKEND_URL}/health`);
            await testEndpoint('Bengaluru CHI', `${BACKEND_URL}/chi/bangalore`);
            await testEndpoint('RVCE CHI', `${BACKEND_URL}/chi/rvce`);
            await testEndpoint('Bengaluru Geometry', `${BACKEND_URL}/geometry/bangalore`);
            await testEndpoint('RVCE Geometry', `${BACKEND_URL}/geometry/rvce`);
        }
    </script>
</body>
</html>
